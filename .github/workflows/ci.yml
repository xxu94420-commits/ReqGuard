name: Quality and deployment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './ai-service[test]'
      - run: ruff check ai-service scripts && ruff format --check ai-service scripts
      - run: cd ai-service && pytest -q
      - run: python scripts/evaluate.py
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: dataset/results.json
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp -f backend/pom.xml spotless:check verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0
      - run: cd frontend && pnpm install --frozen-lockfile --ignore-scripts
      - run: cd frontend && pnpm lint && pnpm format:check && pnpm test && pnpm build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - run: python scripts/smoke.py --base-url http://127.0.0.1:3000
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
