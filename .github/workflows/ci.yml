name: Quality and deployment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './ai-service[test]'
      - run: ruff check ai-service scripts deploy/render && ruff format --check ai-service scripts deploy/render
      - run: cd ai-service && pytest -q
      - run: python scripts/evaluate.py
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: dataset/results.json
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp -f backend/pom.xml spotless:check verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0
      - run: cd frontend && pnpm install --frozen-lockfile --ignore-scripts
      - run: cd frontend && pnpm lint && pnpm format:check && pnpm test && pnpm build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - run: python scripts/smoke.py --base-url http://127.0.0.1:3000
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
  render-demo:
    runs-on: ubuntu-latest
    env:
      DEMO_USERNAME: reqguard
      DEMO_PASSWORD: ci-only-disposable-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - run: docker build -f deploy/render/Dockerfile -t reqguard-render .
      - name: Missing login secret fails closed
        run: |
          if docker run --rm reqguard-render; then
            echo "Container must reject missing credentials"
            exit 1
          fi
      - run: docker run -d --name reqguard-demo --memory=512m -p 127.0.0.1:10000:10000 -e DEMO_USERNAME -e DEMO_PASSWORD reqguard-render
      - run: python scripts/smoke_render.py
      - run: python scripts/smoke.py --base-url http://127.0.0.1:10000
      - if: always()
        run: docker logs reqguard-demo
      - if: always()
        run: docker rm -f reqguard-demo
