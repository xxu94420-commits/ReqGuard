[project]
name = "reqguard-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "pydantic==2.11.7", "uvicorn==0.34.3", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==8.4.1", "ruff==0.12.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
