pid /tmp/reqguard-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/reqguard-client;
    proxy_temp_path /tmp/reqguard-proxy;
    fastcgi_temp_path /tmp/reqguard-fastcgi;
    uwsgi_temp_path /tmp/reqguard-uwsgi;
    scgi_temp_path /tmp/reqguard-scgi;
    limit_req_zone $binary_remote_addr zone=api:1m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    server {
        listen __PORT__;
        root /srv/web;
        client_max_body_size 1m;
        auth_basic "ReqGuard demo";
        auth_basic_user_file /tmp/reqguard.htpasswd;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag noindex always;
        location = /healthz {
            auth_basic off;
            proxy_pass http://127.0.0.1:8080/api/health;
        }
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            limit_req_status 429;
            limit_conn connections 4;
            proxy_pass http://127.0.0.1:8080;
            proxy_read_timeout 40s;
            proxy_set_header Authorization "";
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
