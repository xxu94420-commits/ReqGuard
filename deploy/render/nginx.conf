pid /tmp/reqguard-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/reqguard-client;
    proxy_temp_path /tmp/reqguard-proxy;
    fastcgi_temp_path /tmp/reqguard-fastcgi;
    uwsgi_temp_path /tmp/reqguard-uwsgi;
    scgi_temp_path /tmp/reqguard-scgi;
    limit_req_zone $binary_remote_addr zone=api:1m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    # Rendering the form is not a password attempt. Empty keys are not rate limited.
    map $request_method $login_attempt_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $login_attempt_key zone=login:1m rate=5r/m;
    server {
        listen __PORT__;
        # Render terminates HTTPS; redirects must not expose the internal HTTP port.
        absolute_redirect off;
        root /srv/web;
        client_max_body_size 1m;
        auth_request /_auth;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag noindex always;
        location = /healthz {
            auth_request off;
            proxy_pass http://127.0.0.1:8080/api/health;
        }
        location = /_auth {
            internal;
            auth_request off;
            proxy_pass http://127.0.0.1:9000/_auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Original-Method $request_method;
        }
        location = /login {
            auth_request off;
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:9000/login;
            proxy_set_header Host $http_host;
            proxy_intercept_errors off;
        }
        location = /logout {
            auth_request off;
            proxy_pass http://127.0.0.1:9000/logout;
            proxy_set_header Host $http_host;
        }
        location @login { return 302 /login; }
        location @unauthorized {
            default_type application/json;
            return 401 '{"error":"login_required"}';
        }
        location /api/ {
            error_page 401 = @unauthorized;
            limit_req zone=api burst=30 nodelay;
            limit_req_status 429;
            limit_conn connections 4;
            proxy_pass http://127.0.0.1:8080;
            proxy_read_timeout 40s;
            proxy_set_header Authorization "";
        }
        location / {
            error_page 401 = @login;
            try_files $uri $uri/ /index.html;
        }
    }
}
